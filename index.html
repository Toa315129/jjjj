<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>กินเจ PHOTOBOOTH - Premium Minimal</title>
    
    <!-- External Fonts & Scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QRCode JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Tone JS for Studio Camera & Shutter Audio Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Canvas Confetti for Celebration Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @font-face {
            font-family: 'JS Chanok';
            src: url('https://cdn.jsdelivr.net/gh/Toa315129/Saphabooth@main/JS-Chanok-Normal.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --red-premium: #c62828;
            --red-light: #ef5350;
            --bg-white: #fdfdfd;
            --font-ui: 'Prompt', sans-serif;
            --font-title: 'JS Chanok', 'Prompt', sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-white);
            color: #1f2937; /* zinc-800 */
            overflow: hidden;
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
        }

        /* Minimal Glass Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(198, 40, 40, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
        }

        /* Font Preloader */
        .font-preload {
            font-family: 'JS Chanok';
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(198, 40, 40, 0.2); border-radius: 10px; }

        /* Animation tweaks */
        @keyframes subtlePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
    </style>
</head>
<body class="flex flex-col h-full w-full justify-center items-center bg-gray-50 selection:bg-red-100 selection:text-red-900">

                <div>
                    <h1 class="text-red-700 font-bold text-lg leading-none tracking-widest uppercase">Kin Jay Photobooth</h1>
                    <p class="text-[10px] text-gray-500 font-medium tracking-widest mt-0.5 uppercase">Takuapa Vegetarian Festival</p>
                </div>
            </div>

                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>CLOUD READY</span>
            </div>
        </header>
