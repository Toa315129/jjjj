
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ปังลืมอ้วน PHOTOBOOTH - Minimal Receipt</title>
    
    <!-- External Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QRCode JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Tone JS for Audio Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-red': '#d32f2f',
                        'brand-dark': '#1a1a1a',
                        'receipt-bg': '#fcfcfc',
                    },
                    fontFamily: {
                        ui: ['Prompt', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f5f5f5;
            color: #1a1a1a;
            overflow: hidden;
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
        }

        /* Minimal UI Components */
        .minimal-card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .btn-primary {
            background-color: #d32f2f;
            color: white;
            border: none;
            transition: all 0.2s ease;
        }
        
        .btn-primary:active {
            transform: translateY(2px);
            background-color: #b71c1c;
        }
        
        .btn-outline {
            background-color: transparent;
            color: #d32f2f;
            border: 1px solid #d32f2f;
            transition: all 0.2s ease;
        }
        
        .btn-outline:active {
            background-color: #ffebee;
        }

        /* Receipt edge decoration for canvas preview container */
        .receipt-edge {
            background: #ffffff;
            position: relative;
        }
        .receipt-edge::before, .receipt-edge::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 8px;
            background-size: 16px 16px;
        }
        .receipt-edge::before {
            top: -8px;
            background-image: radial-gradient(circle at 8px 0, transparent 8px, #ffffff 9px);
        }
        .receipt-edge::after {
            bottom: -8px;
            background-image: radial-gradient(circle at 8px 16px, transparent 8px, #ffffff 9px);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-full w-full justify-center items-center">

    <div id="app" class="relative w-full h-full max-w-5xl mx-auto flex flex-col justify-between overflow-hidden bg-white sm:rounded-2xl sm:my-4 sm:h-[calc(100dvh-2rem)] sm:border sm:border-gray-200 sm:shadow-sm">
        
        <!-- Header Bar -->
        <header class="relative z-30 w-full px-6 py-4 flex items-center justify-between border-b border-gray-100 bg-white">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-brand-red flex items-center justify-center font-bold text-white text-sm">
                    🚩
                </div>
                <div>
                    <h1 class="text-brand-red font-bold text-lg leading-none tracking-wide">ปังลืมอ้วน</h1>
                    <p class="text-[10px] text-gray-500 font-mono tracking-wider mt-1 uppercase">Takuapa Veg Festival</p>
                </div>
            </div>

            <div id="connection-status" class="flex items-center gap-1.5 bg-gray-50 px-2.5 py-1 rounded border border-gray-200 text-gray-600 text-xs font-mono">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                <span>SYSTEM.READY</span>
            </div>
        </header>

        <!-- SCREEN 1: START / HOME SCREEN -->
        <section id="screen-home" class="relative z-20 flex-1 flex flex-col items-center justify-center text-center px-4 py-8 bg-[#fafafa]">
            
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded bg-red-50 border border-red-100 text-brand-red font-medium text-xs tracking-wider mb-8">
                <span>เทศกาลกินผัก ตะกั่วป่า</span>
            </div>

            <h2 class="text-5xl sm:text-7xl font-bold text-brand-dark mb-4 tracking-tight">
                ปังลืมอ้วน<span class="text-brand-red">.</span>
            </h2>
            <p class="text-gray-500 text-sm sm:text-base font-light tracking-wide max-w-md mb-12 px-4 leading-relaxed">
                ถ่ายภาพ 3 ช็อตในสไตล์ใบเสร็จมินิมอล<br>สแกน QR Code ดาวน์โหลดภาพขึ้นคลาวด์ได้ทันที
            </p>

            <button onclick="App.startCamera()" class="btn-primary flex items-center justify-center px-8 py-4 font-medium text-lg rounded shadow-sm hover:shadow-md cursor-pointer group">
                <span class="mr-2">กดเพื่อถ่ายภาพ</span>
                <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </section>

        <!-- SCREEN 2: CAMERA VIEWPORT -->
        <section id="screen-cam" class="hidden relative z-20 flex-1 flex flex-col bg-[#f5f5f5]">
            
            <div class="flex-1 p-4 sm:p-6 flex flex-col items-center justify-center relative w-full h-full">
                <!-- Camera Viewfinder Wrapper -->
                <div id="viewfinder" class="relative w-full max-w-3xl flex-1 bg-gray-200 rounded-lg overflow-hidden border border-gray-300 shadow-inner flex items-center justify-center">
                    
                    <video id="video-feed" class="w-full h-full object-cover -scale-x-100" autoplay playsinline muted></video>
                    
                    <!-- Viewfinder Overlay - Minimal Frame -->
                    <div class="absolute inset-0 border-2 border-white/20 pointer-events-none"></div>
                    
                    <!-- Center Crosshair -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-30">
                        <div class="w-8 h-px bg-white"></div>
                        <div class="w-px h-8 bg-white absolute"></div>
                    </div>

                    <!-- Countdown Number -->
                    <div id="countdown" class="hidden absolute z-50 text-8xl font-bold text-white drop-shadow-md">
                        3
                    </div>

                    <!-- Camera Tools -->
                    <div class="absolute top-4 right-4 z-30">
                        <button onclick="App.toggleCamera()" class="p-2.5 rounded bg-black/40 backdrop-blur text-white hover:bg-brand-red transition-colors" title="สลับกล้อง">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>

                    <!-- Shot Status Badge -->
                    <div class="absolute bottom-4 left-4 z-30 bg-white/90 backdrop-blur px-3 py-1.5 rounded border border-gray-200 flex items-center gap-3">
                        <span id="shot-status-text" class="text-brand-dark font-mono text-xs font-semibold">READY [0/3]</span>
                        <div class="flex gap-1.5">
                            <span id="dot-0" class="w-2 h-2 rounded bg-gray-300"></span>
                            <span id="dot-1" class="w-2 h-2 rounded bg-gray-300"></span>
                            <span id="dot-2" class="w-2 h-2 rounded bg-gray-300"></span>
                        </div>
                    </div>
                </div>

                <!-- Shutter Bar -->
                <div class="w-full py-6 flex justify-center items-center">
                    <button id="shutter-btn" onclick="App.startSequence()" class="w-16 h-16 rounded-full border-4 border-gray-200 p-1 hover:border-brand-red transition-colors active:scale-95 flex items-center justify-center bg-white cursor-pointer">
                        <div class="w-full h-full rounded-full bg-brand-red"></div>
                    </button>
                </div>
            </div>
        </section>

        <!-- UPLOADING OVERLAY -->
        <div id="upload-overlay" class="hidden absolute inset-0 z-50 bg-white/95 backdrop-blur flex flex-col items-center justify-center p-6 text-center">
            <div class="w-12 h-12 mb-6 rounded-full border-2 border-gray-100 border-t-brand-red animate-spin"></div>
            <h3 class="text-xl font-medium text-brand-dark mb-2">กำลังพิมพ์ใบเสร็จ...</h3>
            <p class="text-gray-500 font-mono text-xs uppercase tracking-widest">Generating Cloud Link</p>
        </div>

        <!-- SCREEN 3: RESULT & DOWNLOAD -->
        <section id="screen-result" class="hidden relative z-20 flex-1 w-full h-full flex flex-col lg:flex-row p-4 sm:p-6 gap-8 bg-[#f5f5f5] overflow-y-auto">
            
            <!-- Left Side: Canvas Preview (Receipt Style) -->
            <div class="flex-1 flex items-start justify-center h-full w-full pt-4 pb-12">
                <!-- Wrapper for receipt edges -->
                <div class="relative max-w-full inline-block shadow-[0_10px_30px_rgba(0,0,0,0.08)]">
                    <div class="receipt-edge p-2 bg-white">
                        <canvas id="final-canvas" width="1200" height="3400" class="h-auto w-full max-w-[280px] sm:max-w-[320px] object-contain block border border-gray-100"></canvas>
                    </div>
                </div>
            </div>

            <!-- Right Side: Controls -->
            <div class="w-full lg:w-80 flex flex-col gap-4 z-30 shrink-0 self-center pb-8 lg:pb-0">
                
                <!-- QR Card -->
                <div class="minimal-card p-5 flex flex-col items-center text-center">
                    <div class="text-xs font-mono text-gray-500 mb-3 border-b border-gray-100 w-full pb-2">DIGITAL COPY</div>
                    
                    <div class="bg-white p-2 border border-gray-200 rounded mb-4">
                        <div id="imgbb-qr-container" class="w-32 h-32 flex items-center justify-center"></div>
                    </div>

                    <div class="w-full bg-gray-50 border border-gray-200 rounded p-2.5 flex items-center justify-between gap-2">
                        <span id="imgbb-url-text" class="text-[10px] text-gray-600 truncate font-mono">https://i.ibb.co/...</span>
                        <button onclick="App.copyCloudUrl()" class="px-2 py-1 bg-white border border-gray-300 hover:bg-gray-100 text-brand-dark text-[10px] rounded transition-colors font-mono uppercase">
                            Copy
                        </button>
                    </div>
                </div>

                <!-- Action Controls -->
                <div class="flex flex-col gap-2.5">
                    <button onclick="App.downloadCanvas()" class="btn-primary w-full py-3 text-sm font-medium rounded flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        บันทึกรูปภาพ
                    </button>

                    <button onclick="App.openImgBBDirect()" class="btn-outline w-full py-3 text-sm font-medium rounded flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        เปิดลิงก์รูป
                    </button>

                    <button onclick="App.restart()" class="w-full py-3 mt-2 text-gray-500 hover:text-brand-dark bg-gray-100 hover:bg-gray-200 text-sm font-medium rounded transition-colors flex items-center justify-center gap-2">
                        ถ่ายภาพใหม่
                    </button>
                </div>

            </div>
        </section>

    </div>

    <!-- Flash Effect -->
    <div id="flash-effect" class="fixed inset-0 bg-white pointer-events-none z-50 opacity-0 transition-opacity duration-150"></div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-brand-dark text-white px-4 py-2.5 rounded shadow-lg -translate-y-16 opacity-0 transition-all duration-300 flex items-center gap-2 text-sm font-medium">
        <span id="toast-message">แจ้งเตือน</span>
    </div>

    <script>
        const App = (function() {
            const CONFIG = {
                imgbbApiKey: 'ffc90ad0bc5c7e0c056b68ef7430304a',
                totalShots: 3,
                countdownSec: 3,
                canvasWidth: 1200,   
                canvasHeight: 3400, // Adjusted for receipt style
                fontUI: 'Prompt',
                fontMono: 'Space Mono'
            };

            let state = {
                stream: null,
                facingMode: 'user',
                capturedPhotos: [],
                isShooting: false,
                uploadedUrl: '',
            };

            const D = {
                screens: {
                    home: document.getElementById('screen-home'),
                    cam: document.getElementById('screen-cam'),
                    result: document.getElementById('screen-result')
                },
                video: document.getElementById('video-feed'),
                countdown: document.getElementById('countdown'),
                flash: document.getElementById('flash-effect'),
                shutterBtn: document.getElementById('shutter-btn'),
                shotStatusText: document.getElementById('shot-status-text'),
                dots: [
                    document.getElementById('dot-0'),
                    document.getElementById('dot-1'),
                    document.getElementById('dot-2')
                ],
                canvas: document.getElementById('final-canvas'),
                uploadOverlay: document.getElementById('upload-overlay'),
                qrContainer: document.getElementById('imgbb-qr-container'),
                imgbbUrlText: document.getElementById('imgbb-url-text'),
                toast: document.getElementById('toast'),
                toastMsg: document.getElementById('toast-message')
            };

            const SoundFX = {
                playBeep: function() {
                    try {
                        const synth = new Tone.Synth({
                            oscillator: { type: "square" },
                            envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
                        }).toDestination();
                        synth.volume.value = -10;
                        synth.triggerAttackRelease("C5", "32n");
                    } catch(e){}
                },
                playShutter: function() {
                    try {
                        const noise = new Tone.NoiseSynth({
                            noise: { type: 'white' },
                            envelope: { attack: 0.001, decay: 0.1, sustain: 0 }
                        }).toDestination();
                        noise.volume.value = -5;
                        noise.triggerAttackRelease("16n");
                    } catch(e){}
                }
            };

            function showToast(msg) {
                D.toastMsg.innerText = msg;
                D.toast.classList.remove('-translate-y-16', 'opacity-0');
                D.toast.classList.add('translate-y-0', 'opacity-100');
                setTimeout(() => {
                    D.toast.classList.remove('translate-y-0', 'opacity-100');
                    D.toast.classList.add('-translate-y-16', 'opacity-0');
                }, 3000);
            }

            function switchScreen(screenName) {
                Object.values(D.screens).forEach(s => s.classList.add('hidden'));
                D.screens[screenName].classList.remove('hidden');
            }

            async function initCamera() {
                if (state.stream) {
                    state.stream.getTracks().forEach(track => track.stop());
                }
                try {
                    const constraints = {
                        video: { facingMode: state.facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
                        audio: false
                    };
                    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    D.video.srcObject = state.stream;
                    if (state.facingMode === 'user') {
                        D.video.classList.add('-scale-x-100');
                    } else {
                        D.video.classList.remove('-scale-x-100');
                    }
                    return true;
                } catch (err) {
                    console.error("Camera Error:", err);
                    showToast("กรุณาอนุญาตการเข้าถึงกล้องถ่ายรูป");
                    return false;
                }
            }

            function toggleCamera() {
                if (state.isShooting) return;
                state.facingMode = (state.facingMode === 'user') ? 'environment' : 'user';
                initCamera();
            }

            async function startSequence() {
                if (state.isShooting) return;
                state.isShooting = true;
                state.capturedPhotos = [];
                D.shutterBtn.disabled = true;
                D.shutterBtn.classList.add('opacity-50', 'pointer-events-none');

                D.dots.forEach(d => { d.className = "w-2 h-2 rounded bg-gray-300"; });

                for (let i = 0; i < CONFIG.totalShots; i++) {
                    D.shotStatusText.innerText = `REC [${i + 1}/3]`;
                    await runCountdown();
                    triggerFlash();
                    SoundFX.playShutter();
                    captureFrame();
                    D.dots[i].className = "w-2 h-2 rounded bg-brand-red";
                    await delay(700);
                }

                D.shotStatusText.innerText = "PROCESSING";
                await processAndUploadCloud();
            }

            function runCountdown() {
                return new Promise(resolve => {
                    let count = CONFIG.countdownSec;
                    D.countdown.classList.remove('hidden');
                    D.countdown.innerText = count;
                    SoundFX.playBeep();

                    const interval = setInterval(() => {
                        count--;
                        if (count > 0) {
                            D.countdown.innerText = count;
                            SoundFX.playBeep();
                        } else {
                            clearInterval(interval);
                            D.countdown.classList.add('hidden');
                            resolve();
                        }
                    }, 1000);
                });
            }

            function triggerFlash() {
                D.flash.style.opacity = '1';
                setTimeout(() => { D.flash.style.opacity = '0'; }, 100);
            }

            function captureFrame() {
                const v = D.video;
                const canvas = document.createElement('canvas');
                canvas.width = v.videoWidth || 1280;
                canvas.height = v.videoHeight || 720;
                const ctx = canvas.getContext('2d');

                if (state.facingMode === 'user') {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
                state.capturedPhotos.push(canvas);
            }

            function delay(ms) { return new Promise(res => setTimeout(res, ms)); }

            async function processAndUploadCloud() {
                D.uploadOverlay.classList.remove('hidden');
                
                // Render base receipt without QR first
                renderCanvasStrip(null);

                const base64Image = D.canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

                try {
                    const formData = new FormData();
                    formData.append('key', CONFIG.imgbbApiKey);
                    formData.append('image', base64Image);
                    
                    // Mock delay for feeling
                    await delay(500);

                    const response = await fetch('https://api.imgbb.com/1/upload', {
                        method: 'POST', body: formData
                    });

                    const jsonResult = await response.json();

                    if (jsonResult.success) {
                        state.uploadedUrl = jsonResult.data.url;
                        D.imgbbUrlText.innerText = state.uploadedUrl;

                        generateQRCode(state.uploadedUrl);
                        await delay(200);

                        // Render again with QR
                        renderCanvasStrip(state.uploadedUrl);

                        confetti({
                            particleCount: 80,
                            spread: 60,
                            origin: { y: 0.8 },
                            colors: ['#d32f2f', '#1a1a1a', '#ffffff']
                        });
                    } else { throw new Error("Upload Failed"); }
                } catch (err) {
                    console.error("Upload Error:", err);
                    showToast("โหมดออฟไลน์ (อัปโหลดไม่สำเร็จ)");
                    D.imgbbUrlText.innerText = "Offline Mode";
                    generateQRCode("offline");
                    renderCanvasStrip("offline");
                } finally {
                    D.uploadOverlay.classList.add('hidden');
                    switchScreen('result');
                }
            }

            function renderCanvasStrip(qrUrl) {
                const ctx = D.canvas.getContext('2d');
                const W = CONFIG.canvasWidth;
                const H = CONFIG.canvasHeight;
                const cx = W / 2;

                // 1. Background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);

                // Helper: draw dashed line
                function drawDashedLine(y) {
                    ctx.beginPath();
                    ctx.setLineDash([15, 15]);
                    ctx.moveTo(80, y);
                    ctx.lineTo(W - 80, y);
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // 2. Receipt Header
                let currentY = 120;
                
                // Store logo/name
                ctx.fillStyle = '#d32f2f'; // Red text
                ctx.font = `bold 140px ${CONFIG.fontUI}, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText("ปังลืมอ้วน", cx, currentY);
                currentY += 180;

                ctx.fillStyle = '#1a1a1a'; // Dark text
                ctx.font = `50px ${CONFIG.fontUI}, sans-serif`;
                ctx.fillText("เทศกาลกินผัก ตะกั่วป่า", cx, currentY);
                currentY += 100;
                
                // Timestamp info
                const now = new Date();
                const dateStr = now.toLocaleDateString('th-TH');
                const timeStr = now.toLocaleTimeString('th-TH');
                const receiptNo = `NO. ${Math.floor(10000 + Math.random() * 90000)}`;

                ctx.font = `36px ${CONFIG.fontMono}, monospace`;
                ctx.fillStyle = '#666666';
                ctx.textAlign = 'left';
                ctx.fillText(`DATE: ${dateStr}`, 100, currentY);
                ctx.textAlign = 'right';
                ctx.fillText(`TIME: ${timeStr}`, W - 100, currentY);
                
                currentY += 60;
                ctx.textAlign = 'center';
                ctx.fillText(`TRX: ${receiptNo}`, cx, currentY);
                
                currentY += 80;
                drawDashedLine(currentY);
                currentY += 80;

                // 3. Photos (4:3 ratio)
                const photoW = 1040;
                const photoH = 780;
                const padX = (W - photoW) / 2;
                const gap = 80;

                state.capturedPhotos.forEach((photoCanvas) => {
                    // Thin black border
                    ctx.strokeStyle = '#1a1a1a';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(padX - 2, currentY - 2, photoW + 4, photoH + 4);
                    
                    drawImageCover(ctx, photoCanvas, padX, currentY, photoW, photoH);
                    currentY += photoH + gap;
                });

                drawDashedLine(currentY - gap / 2);
                currentY += gap / 2;

                // 4. Footer & QR
                ctx.textAlign = 'left';
                ctx.fillStyle = '#1a1a1a';
                ctx.font = `bold 60px ${CONFIG.fontUI}, sans-serif`;
                ctx.fillText("THANK YOU", 100, currentY);
                
                ctx.fillStyle = '#d32f2f';
                ctx.font = `40px ${CONFIG.fontUI}, sans-serif`;
                ctx.fillText("FOR SUPPORTING", 100, currentY + 60);
                
                ctx.fillStyle = '#666666';
                ctx.font = `30px ${CONFIG.fontMono}, monospace`;
                ctx.fillText("TAKUAPA VEGETARIAN FEST", 100, currentY + 120);
                
                // Draw QR Code on the right
                if (qrUrl) {
                    const qrImg = D.qrContainer.querySelector('img') || D.qrContainer.querySelector('canvas');
                    if (qrImg && qrUrl !== "offline") {
                        const qrSize = 200;
                        const qrX = W - 100 - qrSize;
                        const qrY = currentY - 20;

                        // QR Border
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(qrX - 10, qrY - 10, qrSize + 20, qrSize + 20);
                        ctx.strokeStyle = '#1a1a1a';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(qrX - 10, qrY - 10, qrSize + 20, qrSize + 20);

                        ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
                        
                        ctx.textAlign = 'center';
                        ctx.fillStyle = '#1a1a1a';
                        ctx.font = `20px ${CONFIG.fontMono}, monospace`;
                        ctx.fillText("SCAN TO DL", qrX + qrSize/2, qrY + qrSize + 30);
                    } else if (qrUrl === "offline") {
                         ctx.textAlign = 'right';
                         ctx.fillStyle = '#666666';
                         ctx.font = `30px ${CONFIG.fontMono}, monospace`;
                         ctx.fillText("OFFLINE PRINT", W - 100, currentY + 60);
                    }
                }
                
                currentY += 240;
                
                // Barcode mock at the very bottom
                ctx.fillStyle = '#1a1a1a';
                const barcodeH = 100;
                let bx = 100;
                while (bx < W - 100) {
                    const barW = Math.random() > 0.5 ? 4 : 12;
                    ctx.fillRect(bx, currentY, barW, barcodeH);
                    bx += barW + (Math.random() * 10 + 4);
                }
            }

            function drawImageCover(ctx, img, x, y, w, h) {
                const imgW = img.width;
                const imgH = img.height;
                const imgRatio = imgW / imgH;
                const targetRatio = w / h;

                let renderW, renderH, offsetX = 0, offsetY = 0;

                if (imgRatio > targetRatio) {
                    renderH = imgH;
                    renderW = imgH * targetRatio;
                    offsetX = (imgW - renderW) / 2;
                } else {
                    renderW = imgW;
                    renderH = imgW / targetRatio;
                    offsetY = (imgH - renderH) / 2;
                }

                ctx.drawImage(img, offsetX, offsetY, renderW, renderH, x, y, w, h);
            }

            function generateQRCode(url) {
                D.qrContainer.innerHTML = '';
                if(url === "offline") return;
                new QRCode(D.qrContainer, {
                    text: url,
                    width: 128,
                    height: 128,
                    colorDark: "#1a1a1a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.L
                });
            }

            function downloadCanvas() {
                try {
                    const link = document.createElement('a');
                    link.download = `PungLuemAuan_Receipt_${Date.now()}.jpg`;
                    link.href = D.canvas.toDataURL('image/jpeg', 0.9);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("ดาวน์โหลดรูปภาพแล้ว");
                } catch(e) {
                    showToast("กรุณากดค้างที่รูปภาพเพื่อบันทึก");
                }
            }

            function copyCloudUrl() {
                if (!state.uploadedUrl) return;
                navigator.clipboard.writeText(state.uploadedUrl).then(() => {
                    showToast("คัดลอกลิงก์แล้ว");
                }).catch(() => {
                    showToast("ไม่สามารถคัดลอกได้");
                });
            }

            function openImgBBDirect() {
                if (state.uploadedUrl) {
                    window.open(state.uploadedUrl, '_blank');
                } else {
                    showToast("ไม่มีลิงก์รูปภาพ");
                }
            }

            function restartApp() {
                state.capturedPhotos = [];
                state.isShooting = false;
                state.uploadedUrl = '';
                D.shutterBtn.disabled = false;
                D.shutterBtn.classList.remove('opacity-50', 'pointer-events-none');
                D.dots.forEach(d => { d.className = "w-2 h-2 rounded bg-gray-300"; });
                switchScreen('cam');
            }

            return {
                startCamera: async function() {
                    const ok = await initCamera();
                    if (ok) switchScreen('cam');
                },
                toggleCamera: toggleCamera,
                startSequence: startSequence,
                downloadCanvas: downloadCanvas,
                copyCloudUrl: copyCloudUrl,
                openImgBBDirect: openImgBBDirect,
                restart: restartApp
            };
        })();
    </script>
</body>
</html>
